<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#111827">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>ボドゲスコア</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
    "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  background: #f3f4f6;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 20px;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

header p {
  margin: 6px 0 0;
  font-size: 13px;
  opacity: .75;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 16px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

h2 {
  font-size: 18px;
  margin: 0 0 14px;
}

h3 {
  font-size: 16px;
  margin: 20px 0 10px;
}

input,
select,
button {
  width: 100%;
  padding: 11px;
  border-radius: 9px;
  font-size: 15px;
}

input,
select {
  border: 1px solid #d1d5db;
  background: white;
}

button {
  border: none;
  background: #111827;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #e5e7eb;
  color: #111827;
}

button.danger {
  background: #fee2e2;
  color: #991b1b;
}

button.small {
  width: auto;
  padding: 7px 10px;
  font-size: 12px;
}

.row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.row > * {
  flex: 1;
}

.player-row {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}

.player-row select {
  flex: 2;
}

.player-row input {
  flex: 1;
}

.game-item {
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
}

.game-title {
  font-weight: bold;
  font-size: 16px;
}

.game-meta {
  font-size: 12px;
  color: #6b7280;
  margin-top: 4px;
}

.rank-list {
  margin-top: 10px;
}

.rank-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #f0f0f0;
}

.rank-number {
  width: 42px;
  font-weight: bold;
  text-align: center;
}

.rank-player {
  flex: 1;
}

.rank-score {
  font-weight: bold;
  font-size: 17px;
}

.history-item {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.history-date {
  font-size: 12px;
  color: #6b7280;
  margin-bottom: 5px;
}

.history-score {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
}

.history-winner {
  font-weight: bold;
}

.empty {
  color: #9ca3af;
  font-size: 14px;
  padding: 10px 0;
}

.radio-group {
  display: flex;
  gap: 8px;
}

.radio-option {
  flex: 1;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  padding: 12px;
  text-align: center;
  cursor: pointer;
}

.radio-option input {
  width: auto;
  margin-right: 5px;
}

.section-note {
  font-size: 12px;
  color: #6b7280;
  margin: -5px 0 12px;
}

.hidden {
  display: none;
}

.screen {
  max-width: 700px;
  margin: auto;
  padding: 24px 16px;
}

.screen button {
  margin-bottom: 12px;
}

.screenContent {
  display: none;
}

.screenContent.active {
  display: block;
}

.stat-box {
  background: #f9fafb;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
}

.stat-label {
  font-size: 12px;
  color: #6b7280;
}

.stat-value {
  font-size: 20px;
  font-weight: bold;
  margin-top: 3px;
}

.player-detail-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
}

.backup-buttons {
  display: flex;
  gap: 8px;
}

.backup-buttons button {
  flex: 1;
}

#fileInput {
  display: none;
}
</style>
</head>

<body>
  
  <!-- ホーム画面 -->
<div id="homeScreen" class="screen">

  <h1>🎲 ボドゲスコア</h1>

  <button onclick="showScreen('recordScreen')">
    🎲 ゲームを記録
  </button>

  <button onclick="showScreen('rankingScreen')">
    🏆 ランキング
  </button>

  <button onclick="showScreen('infoScreen')">
    ⚙️ 情報登録
  </button>

</div>


<div id="mainContent" class="container hidden">

<!-- ゲームを記録画面 -->
<div id="recordScreen" class="screenContent">

  <button
    class="secondary"
    type="button"
    onclick="showScreen('homeScreen')"
  >
    ← ホームに戻る
  </button>

  <!-- 対戦記録 -->
  <div class="card">
    <h2>🎮 対戦を記録</h2>

    <select id="matchGame">
      <option value="">ゲームを選択</option>
    </select>
    
      <div id="previousMembersArea" style="margin-top:10px;"></div>
  
      <div id="scorePlayers" style="margin-top:12px;"></div>

    <button class="secondary" onclick="addScorePlayer()">
      ＋ プレイヤーを追加
    </button>

    <button style="margin-top:10px;" onclick="recordMatch()">
      対戦を記録する
    </button>
  </div>
  
</div>

<header>
  <h1>🎲 ボドゲスコア</h1>
  <p>対戦結果を記録して、ゲームごとのランキングを作ろう</p>
</header>


<!-- 情報登録画面 -->
<div id="infoScreen" class="screenContent">

  <button
    class="secondary"
    type="button"
    onclick="showScreen('homeScreen')"
  >
    ← ホームに戻る
  </button>

  <!-- ゲーム登録 -->
  <div class="card">
    <h2>🎲 ゲームを登録</h2>

    <input id="gameName" placeholder="ゲーム名">

    <p class="section-note">
      このゲームでは、どちらの得点が上位になりますか？
    </p>

    <div class="radio-group">
      <label class="radio-option">
        <input type="radio"
               name="scoreDirection"
               value="high"
               checked>
        高得点が上位
      </label>

      <label class="radio-option">
        <input type="radio"
               name="scoreDirection"
               value="low">
        低得点が上位
      </label>
    </div>

    <button style="margin-top:10px;" onclick="registerGame()">
      ゲームを登録
    </button>
  </div>


  <!-- プレイヤー登録 -->
  <div class="card">
    <h2>👤 プレイヤーを登録</h2>

    <div class="row">
      <input id="playerName" placeholder="プレイヤー名">
      <button onclick="registerPlayer()">追加</button>
    </div>

    <div id="playerList" style="margin-top:12px;"></div>
  </div>

<!-- ランキング画面 -->
<div id="rankingScreen" class="screenContent">

  <button
    class="secondary"
    type="button"
    onclick="showScreen('homeScreen')"
  >
    ← ホームに戻る
  </button>

  <!-- ゲーム一覧 -->
  <div class="card">
    <h2>📚 ゲーム一覧</h2>
    <div id="gameList"></div>
  </div>


  <!-- プレイヤー一覧・戦績 -->
  <div class="card">
    <h2>👥 プレイヤー戦績</h2>
    <div id="playerStatsList"></div>
  </div>


  <!-- ゲーム詳細 -->
  <div class="card hidden" id="gameDetail">

    <h2 id="detailGameName"></h2>

    <div id="detailGameDirection"
         class="section-note"></div>

    <h3>🏆 個人ベストランキング</h3>
    <div id="bestRanking"></div>

    <h3>📊 ゲーム統計</h3>
    <div id="gameStats"></div>

    <h3>📝 対戦履歴</h3>
    <div id="matchHistory"></div>

  </div>


  <!-- プレイヤー詳細 -->
  <div class="card hidden" id="playerDetail">

    <h2 id="detailPlayerName"></h2>

    <div id="playerDetailStats"></div>

  </div>

</div>

  <!-- バックアップ -->
  <div class="card">
    <h2>💾 データ管理</h2>

    <p class="section-note">
      スマホの機種変更やSafariのデータ消去に備えて、
      定期的にバックアップしてください。
    </p>

    <div class="backup-buttons">

      <button onclick="exportData()">
        データを書き出す
      </button>

      <button class="secondary"
              onclick="document.getElementById('fileInput').click()">
        データを復元
      </button>

    </div>

    <input
      type="file"
      id="fileInput"
      accept=".json"
      onchange="importData(event)"
    >

  </div>

</div>
</div>

<script>

const STORAGE_KEY = "boardgameData";


/* =========================
   データ読み込み
========================= */

let data = loadData();


function loadData() {

  const saved =
    localStorage.getItem(STORAGE_KEY);

  if (!saved) {

    return {
      players: [],
      games: [],
      matches: []
    };

  }


  try {

    const old =
      JSON.parse(saved);


    const players =
      Array.isArray(old.players)
        ? old.players.map(p => {

            if (typeof p === "string") {

              return {
                name: p,
                active: true
              };

            }

            return {
              name: p.name,
              active:
                p.active !== false
            };

          })
        : [];


    const games =
      Array.isArray(old.games)
        ? old.games.map(g => {

            if (typeof g === "string") {

              return {
                name: g,
                direction: "high",
                active: true
              };

            }

            return {
              name: g.name,
              direction:
                g.direction || "high",
              active:
                g.active !== false
            };

          })
        : [];


    const matches =
      Array.isArray(old.matches)
        ? old.matches
        : [];


    /*
      過去記録にしか存在しない
      プレイヤー・ゲームも復元
    */

    matches.forEach(match => {

      if (match.game) {

        const exists =
          games.some(
            g => g.name === match.game
          );


        if (!exists) {

          games.push({
            name: match.game,
            direction: "high",
            active: false
          });

        }

      }


      if (Array.isArray(match.scores)) {

        match.scores.forEach(item => {

          if (!item.player) return;


          const exists =
            players.some(
              p => p.name === item.player
            );


          if (!exists) {

            players.push({
              name: item.player,
              active: false
            });

          }

        });

      }

    });


    return {
      players,
      games,
      matches
    };


  } catch (e) {

    console.error(e);

    return {
      players: [],
      games: [],
      matches: []
    };

  }

}


function saveData() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* =========================
   ゲーム登録
========================= */

function registerGame() {

  const input =
    document.getElementById("gameName");


  const name =
    input.value.trim();


  if (!name) {

    alert("ゲーム名を入力してください");

    return;

  }


  const direction =
    document.querySelector(
      'input[name="scoreDirection"]:checked'
    ).value;


  const existing =
    data.games.find(
      g => g.name === name
    );


  if (existing) {

    existing.active = true;
    existing.direction = direction;

  } else {

    data.games.push({

      name,
      direction,
      active: true

    });

  }


  saveData();

  input.value = "";

  updateAll();

  alert("ゲームを登録しました");

}


/* =========================
   ゲームを登録から外す
========================= */

function archiveGame(name) {

  const game =
    data.games.find(
      g => g.name === name
    );


  if (!game) return;


  if (
    !confirm(
      `${name}を登録一覧から外しますか？\n\n過去の対戦記録は残ります。`
    )
  ) {

    return;

  }


  game.active = false;

  saveData();

  updateAll();

}


/* =========================
   プレイヤー登録
========================= */

function registerPlayer() {

  const input =
    document.getElementById("playerName");


  const name =
    input.value.trim();


  if (!name) {

    alert("プレイヤー名を入力してください");

    return;

  }


  const existing =
    data.players.find(
      p => p.name === name
    );


  if (existing) {

    existing.active = true;

  } else {

    data.players.push({

      name,
      active: true

    });

  }


  saveData();

  input.value = "";

  updateAll();

}


/* =========================
   プレイヤーを登録から外す
========================= */

function archivePlayer(name) {

  const player =
    data.players.find(
      p => p.name === name
    );


  if (!player) return;


  if (
    !confirm(
      `${name}を登録一覧から外しますか？\n\n過去の対戦記録は残ります。`
    )
  ) {

    return;

  }


  player.active = false;

  saveData();

  updateAll();

}


/* =========================
   対戦記録入力
========================= */

function addScorePlayer(
  playerName = "",
  score = ""
) {

  const container =
    document.getElementById(
      "scorePlayers"
    );


  const div =
    document.createElement("div");


  div.className =
    "player-row";


  const select =
    document.createElement("select");

  select.className =
    "match-player";


  const defaultOption =
    document.createElement("option");

  defaultOption.value = "";
  defaultOption.textContent =
    "プレイヤーを選択";


  select.appendChild(
    defaultOption
  );


  data.players
    .filter(p => p.active)
    .forEach(p => {

      const option =
        document.createElement("option");

      option.value =
        p.name;

      option.textContent =
        p.name;

      if (p.name === playerName) {

        option.selected = true;

      }

      select.appendChild(option);

    });


  const input =
    document.createElement("input");

  input.className =
    "match-score";

  input.type =
    "number";

  input.placeholder =
    "得点";

  input.value =
    score;


  const remove =
    document.createElement("button");

  remove.className =
    "small danger";

  remove.textContent =
    "×";

  remove.type =
    "button";

  remove.onclick = () =>
    div.remove();


  div.appendChild(select);
  div.appendChild(input);
  div.appendChild(remove);

  container.appendChild(div);

}


/* =========================
   対戦を記録
========================= */

function recordMatch() {

  const gameName =
    document.getElementById(
      "matchGame"
    ).value;


  if (!gameName) {

    alert("ゲームを選択してください");

    return;

  }


  const rows =
    document.querySelectorAll(
      "#scorePlayers .player-row"
    );


  if (rows.length === 0) {

    alert(
      "プレイヤーを追加してください"
    );

    return;

  }


  const scores = [];

  const usedPlayers = new Set();


  for (const row of rows) {

    const player =
      row.querySelector(
        ".match-player"
      ).value;


    const scoreText =
      row.querySelector(
        ".match-score"
      ).value;


    if (!player || scoreText === "") {

      alert(
        "プレイヤーと得点を入力してください"
      );

      return;

    }


    if (usedPlayers.has(player)) {

      alert(
        `${player}が重複しています`
      );

      return;

    }


    usedPlayers.add(player);


    scores.push({

      player,

      score: Number(scoreText)

    });

  }


  const game =
    data.games.find(
      g => g.name === gameName
    );


  const direction =
    game
      ? game.direction
      : "high";


  /*
    勝者を自動判定
  */

  let bestScore =
    direction === "high"
      ? -Infinity
      : Infinity;


  scores.forEach(item => {

    if (direction === "high") {

      if (item.score > bestScore) {

        bestScore =
          item.score;

      }

    } else {

      if (item.score < bestScore) {

        bestScore =
          item.score;

      }

    }

  });


  scores.forEach(item => {

    item.winner =
      item.score === bestScore;

  });


  const wasEditing =
  window.editingMatchId !== null &&
  window.editingMatchId !== undefined;

if (wasEditing) {

  const matchIndex =
    data.matches.findIndex(
      m => m.id === window.editingMatchId
    );

  if (matchIndex !== -1) {

    data.matches[matchIndex] = {
      ...data.matches[matchIndex],
      game: gameName,
      scores
    };

  }

  window.editingMatchId = null;

const recordButton = document.querySelector(
  'button[onclick="recordMatch()"]'
);

if (recordButton) {
  recordButton.textContent = "対戦を記録する";
}

} else {

  data.matches.push({
    id: Date.now(),
    date: new Date().toISOString(),
    game: gameName,
    scores
  });

}


  saveData();


  document.getElementById(
    "scorePlayers"
  ).innerHTML = "";


  addScorePlayer();


  alert(
    "対戦結果を記録しました！"
  );


  updateAll();

}


/* =========================
   ゲーム選択
========================= */

function renderGameSelect() {

  const select =
    document.getElementById(
      "matchGame"
    );


  const current =
    select.value;


  select.innerHTML =
    `<option value="">
      ゲームを選択
    </option>`;


  data.games
    .filter(g => g.active)
    .forEach(game => {

      const option =
        document.createElement("option");

      option.value =
        game.name;

      option.textContent =
        game.name;

      select.appendChild(option);

    });


  if (
    data.games.some(
      g =>
        g.active &&
        g.name === current
    )
  ) {

    select.value = current;

  }

}

/* =========================
   前回のメンバー
========================= */

function renderPreviousMembers() {

  const container =
    document.getElementById(
      "previousMembersArea"
    );

  if (!container) return;

  container.innerHTML = "";

  /*
    直近の対戦記録を取得
    ゲームは問わない
  */

  if (
    !Array.isArray(data.matches) ||
    data.matches.length === 0
  ) {
    return;
  }

  const latestMatch =
    [...data.matches].sort(
      (a, b) =>
        new Date(b.date) -
        new Date(a.date)
    )[0];

  if (
    !latestMatch ||
    !Array.isArray(latestMatch.scores) ||
    latestMatch.scores.length === 0
  ) {
    return;
  }

  const button =
    document.createElement("button");

  button.type = "button";
  button.className = "secondary";

  button.textContent =
    "🔄 前回のメンバーを使用";

  button.onclick = () => {

  const currentRows =
    document.querySelectorAll(
      "#scorePlayers .player-row"
    );

  const hasInput =
    Array.from(currentRows).some(row => {

      const player =
        row.querySelector(
          ".match-player"
        ).value;

      const score =
        row.querySelector(
          ".match-score"
        ).value;

      return player !== "" || score !== "";

    });

  if (hasInput) {

    const confirmed =
      confirm(
        "現在入力中のメンバー・得点を置き換えます。\n\n前回のメンバーを使用しますか？"
      );

    if (!confirmed) {
      return;
    }

  }

  document.getElementById(
    "scorePlayers"
  ).innerHTML = "";

  latestMatch.scores.forEach(item => {

    addScorePlayer(
      item.player,
      ""
    );

  });

};

  container.appendChild(button);

}

/* =========================
   ゲーム一覧
========================= */

function renderGameList() {

  const container =
    document.getElementById(
      "gameList"
    );


  const activeGames =
    data.games.filter(
      g => g.active
    );


  if (activeGames.length === 0) {

    container.innerHTML =
      `<div class="empty">
        まだゲームが登録されていません
      </div>`;

    return;

  }


  container.innerHTML = "";


  activeGames.forEach(game => {

    const matchCount =
      data.matches.filter(
        m => m.game === game.name
      ).length;


    const direction =
      game.direction === "high"
        ? "高得点が上位"
        : "低得点が上位";


    const item =
      document.createElement("div");

    item.className =
      "game-item";

    item.style.cursor =
      "pointer";


    const row =
      document.createElement("div");

    row.className =
      "row";


    const info =
      document.createElement("div");

    info.innerHTML = `
      <div class="game-title">
        ${escapeHTML(game.name)}
      </div>

      <div class="game-meta">
        ${direction}
        ／
        ${matchCount}回対戦
      </div>
    `;


    info.onclick = () =>
      showGameDetail(game.name);


    const button =
      document.createElement("button");

    button.className =
      "small danger";

    button.textContent =
      "登録から外す";


    button.onclick = event => {

      event.stopPropagation();

      archiveGame(game.name);

    };


    row.appendChild(info);
    row.appendChild(button);

    item.appendChild(row);

    container.appendChild(item);

  });

}


/* =========================
   プレイヤー一覧
========================= */

function renderPlayerList() {

  const container =
    document.getElementById(
      "playerList"
    );


  const activePlayers =
    data.players.filter(
      p => p.active
    );


  if (activePlayers.length === 0) {

    container.innerHTML =
      `<div class="empty">
        まだプレイヤーが登録されていません
      </div>`;

    return;

  }


  container.innerHTML = "";


  activePlayers.forEach(player => {

    const row =
      document.createElement("div");

    row.className =
      "row";

/* =========================
   個人ベストランキング
========================= */

function renderBestRanking(
  gameName,
  direction
) {

  const container =
    document.getElementById(
      "bestRanking"
    );


  const matches =
    data.matches.filter(
      m => m.game === gameName
    );


  const bestScores = {};


  matches.forEach(match => {

    match.scores.forEach(item => {

      const player =
        item.player;

      const score =
        Number(item.score);


      if (
        bestScores[player] === undefined
      ) {

        bestScores[player] =
          score;

      } else if (
        direction === "high" &&
        score > bestScores[player]
      ) {

        bestScores[player] =
          score;

      } else if (
        direction === "low" &&
        score < bestScores[player]
      ) {

        bestScores[player] =
          score;

      }

    });

  });


  const ranking =
    Object.entries(bestScores)
      .sort((a, b) => {

        return direction === "high"
          ? b[1] - a[1]
          : a[1] - b[1];

      });


  if (ranking.length === 0) {

    container.innerHTML =
      `<div class="empty">
        まだ対戦記録がありません
      </div>`;

    return;

  }


  let previousScore = null;
  let currentRank = 0;


  container.innerHTML = "";


  ranking.forEach(
    ([player, score], index) => {

      if (score !== previousScore) {

        currentRank =
          index + 1;

        previousScore =
          score;

      }


      const item =
        document.createElement("div");

      item.className =
        "rank-item";


      const number =
        document.createElement("div");

      number.className =
        "rank-number";

      number.textContent =
        `${currentRank}位`;


      const playerDiv =
        document.createElement("div");

      playerDiv.className =
        "rank-player";

      playerDiv.textContent =
        player;


      const scoreDiv =
        document.createElement("div");

      scoreDiv.className =
        "rank-score";

      scoreDiv.textContent =
        `${score}点`;


      item.appendChild(number);
      item.appendChild(playerDiv);
      item.appendChild(scoreDiv);


      container.appendChild(item);

    }
  );

}

function renderGameStats(gameName) {

  const container =
    document.getElementById(
      "gameStats"
    );


  const matches =
    data.matches.filter(
      m => m.game === gameName
    );


  const players =
    new Set();


  let totalScores = 0;
  let scoreCount = 0;


  matches.forEach(match => {

    match.scores.forEach(item => {

      players.add(item.player);

      totalScores +=
        Number(item.score);

      scoreCount++;

    });

  });


  const average =
    scoreCount > 0
      ? (totalScores / scoreCount).toFixed(1)
      : "-";


  container.innerHTML = `

    <div class="stat-box">

        対戦回数

      <div class="stat-value">

}

function showPlayerDetail(playerName) {

  document.getElementById(
    "playerDetail"
  ).classList.remove("hidden");


  document.getElementById(
    "gameDetail"
  ).classList.add("hidden");


  document.getElementById(
    "detailPlayerName"
  ).textContent =
    `👤 ${playerName}`;


  const matches =
    getPlayerMatches(playerName);


  let wins = 0;
  let totalScore = 0;


  const gameStats = {};


  matches.forEach(match => {

    const item =
      match.scores.find(
        s =>
          s.player === playerName
      );


    if (!item) return;


    totalScore +=
      Number(item.score);


    if (
      isWinner(
        match,
        playerName
      )
    ) {

      wins++;

    }


    if (!gameStats[match.game]) {

      gameStats[match.game] = {

        matches: 0,
        wins: 0,
        best: null

      };

    }


    gameStats[match.game].matches++;


    if (
      isWinner(
        match,
        playerName
      )
    ) {

      gameStats[match.game].wins++;

    }


    const game =
      data.games.find(
        g => g.name === match.game
      );


    const direction =
      game
        ? game.direction
        : "high";


    const best =
      gameStats[match.game].best;


    if (
      best === null ||
      (
        direction === "high" &&
        item.score > best
      ) ||
      (
        direction === "low" &&
        item.score < best
      )
    ) {

      gameStats[match.game].best =
        Number(item.score);

    }

  });


  const average =
    matches.length > 0
      ? (
          totalScore /
          matches.length
        ).toFixed(1)
      : "-";


  const winRate =
    matches.length > 0
      ? (
          wins /
          matches.length *
          100
        ).toFixed(1)
      : "0.0";


  const container =
    document.getElementById(
      "playerDetailStats"
    );


  let html = `

    <div class="stat-box">
      <div class="stat-label">
        総対戦数
      </div>
      <div class="stat-value">
        ${matches.length}戦
      </div>
    </div>

    <div class="stat-box">
      <div class="stat-label">
        1位回数
      </div>
      <div class="stat-value">
        ${wins}勝
      </div>
    </div>

    <div class="stat-box">
      <div class="stat-label">
        勝率
      </div>
      <div class="stat-value">
        ${winRate}%
      </div>
    </div>

    <div class="stat-box">
      <div class="stat-label">
        平均得点
      </div>
      <div class="stat-value">
        ${average}点
      </div>
    </div>

    <h3>ゲーム別戦績</h3>

  `;


  const games =
    Object.entries(
      gameStats
    );


  if (games.length === 0) {

    html +=
      `<div class="empty">
        まだ対戦記録がありません
      </div>`;

  } else {

    games.forEach(
      ([gameName, stats]) => {

        const rate =
          stats.matches > 0
            ? (
                stats.wins /
                stats.matches *
                100
              ).toFixed(1)
            : "0.0";


        html += `

          <div class="stat-box">

            <strong>
              ${escapeHTML(gameName)}
            </strong>

            <div style="margin-top:6px;">
              ${stats.matches}戦
              ／
              ${stats.wins}勝
              ／
              勝率 ${rate}%
            </div>

            <div style="margin-top:4px;">
              ベスト：
              <strong>
                ${stats.best}点
              </strong>
            </div>

          </div>

        `;

      }
    );

  }


  container.innerHTML =
    html;

}


/* =========================
   プレイヤーの対戦取得
========================= */

function getPlayerMatches(
  playerName
) {

  return data.matches.filter(
    match =>
      Array.isArray(match.scores) &&
      match.scores.some(
        s =>
          s.player ===
          playerName
      )
  );

}


/* =========================
   勝者判定
========================= */

function isWinner(
  match,
  playerName
) {

  const game =
    data.games.find(
      g => g.name === match.game
    );


  const direction =
    game
      ? game.direction
      : "high";


  const item =
    match.scores.find(
      s =>
        s.player === playerName
    );


  if (!item) return false;


  const scores =
    match.scores.map(
      s => Number(s.score)
    );


  const best =
    direction === "high"
      ? Math.max(...scores)
      : Math.min(...scores);


  return Number(item.score) === best;

}

function exportData() {

  const json =
    JSON.stringify(
      data,
      null,
      2
    );


  const blob =
    new Blob(
      [json],
      {
        type: "application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  const date =
    new Date()
      .toISOString()
      .slice(0, 10);


  a.href = url;

  a.download =
    `boardgame-backup-${date}.json`;


  a.click();


  URL.revokeObjectURL(url);


  alert(
    "バックアップファイルを書き出しました！"
  );

}


/* =========================
   バックアップ復元
========================= */

function importData(event) {

  const file =
    event.target.files[0];


  if (!file) return;


  if (
    !confirm(
      "現在のデータをバックアップデータで置き換えます。\n\nよろしいですか？"
    )
  ) {

    event.target.value = "";

    return;

  }


  const reader =
    new FileReader();


  reader.onload = function(e) {

    try {

      const imported =
        JSON.parse(
          e.target.result
        );


      if (
        !imported ||
        !Array.isArray(
          imported.players
        ) ||
        !Array.isArray(
          imported.games
        ) ||
        !Array.isArray(
          imported.matches
        )
      ) {

        throw new Error(
          "形式が違います"
        );

      }


      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(imported)
      );


      data =
        loadData();


      updateAll();


      document.getElementById(
        "scorePlayers"
      ).innerHTML = "";


      addScorePlayer();


      alert(
        "データを復元しました！"
      );


    } catch (error) {

      alert(
        "バックアップファイルを読み込めませんでした。"
      );

      console.error(error);

    }


    event.target.value = "";

  };


  reader.readAsText(file);

}

/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(str) {

  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

   対戦編集
========================= */

function editMatch(matchId) {

  const match =
    data.matches.find(
      m => m.id === matchId
    );

  if (!match) return;

  // ゲームを選択
  const gameSelect =
    document.getElementById("matchGame");

  gameSelect.value =
    match.game;

  // 現在の入力欄をクリア
  const container =
    document.getElementById("scorePlayers");

  container.innerHTML = "";

  // メンバー・得点を読み込む
  match.scores.forEach(item => {

    addScorePlayer(
      item.player,
      item.score
    );

  });

  // 編集中の対戦IDを保存
  window.editingMatchId =
    matchId;

  // ボタンの表示を変更
  const recordButton =
    document.querySelector(
      'button[onclick="recordMatch()"]'
    );

  if (recordButton) {

    recordButton.textContent =
      "対戦結果を更新する";

  }

  // 対戦記録の場所までスクロール
  document.querySelector(
    "#matchGame"
  ).scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}

/* =========================
   画面切り替え
========================= */

function showScreen(screenName) {

  const home =
    document.getElementById("homeScreen");

  const main =
    document.getElementById("mainContent");

  const screens =
    document.querySelectorAll(".screenContent");


  /* ホーム画面 */

  if (screenName === "homeScreen") {

    home.classList.remove("hidden");

    main.classList.add("hidden");

    screens.forEach(screen => {
      screen.classList.remove("active");
    });

    return;

  }


  /* ホームを隠す */

  home.classList.add("hidden");

  main.classList.remove("hidden");


  /* すべての画面を隠す */

  screens.forEach(screen => {
    screen.classList.remove("active");
  });


  /* 選択した画面だけ表示 */

  const target =
    document.getElementById(screenName);

  if (target) {
    target.classList.add("active");
  }

}
