<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>ボドゲスコア</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
               "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  background: #f3f4f6;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 20px;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

header p {
  margin: 6px 0 0;
  font-size: 13px;
  opacity: .75;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 16px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

h2 {
  font-size: 18px;
  margin: 0 0 14px;
}

h3 {
  font-size: 16px;
  margin: 20px 0 10px;
}

input,
select,
button {
  width: 100%;
  padding: 11px;
  border-radius: 9px;
  font-size: 15px;
}

input,
select {
  border: 1px solid #d1d5db;
  background: white;
}

button {
  border: none;
  background: #111827;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #e5e7eb;
  color: #111827;
}

button.danger {
  background: #fee2e2;
  color: #991b1b;
}

button.small {
  width: auto;
  padding: 7px 10px;
  font-size: 12px;
}

.row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.row > * {
  flex: 1;
}

.player-row {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}

.player-row input:first-child {
  flex: 2;
}

.player-row input:last-child {
  flex: 1;
}

.game-item {
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
}

.game-title {
  font-weight: bold;
  font-size: 16px;
}

.game-meta {
  font-size: 12px;
  color: #6b7280;
  margin-top: 4px;
}

.rank-list {
  margin-top: 10px;
}

.rank-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #f0f0f0;
}

.rank-number {
  width: 30px;
  font-weight: bold;
  text-align: center;
}

.rank-player {
  flex: 1;
}

.rank-score {
  font-weight: bold;
  font-size: 17px;
}

.history-item {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.history-date {
  font-size: 12px;
  color: #6b7280;
  margin-bottom: 5px;
}

.history-score {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
}

.empty {
  color: #9ca3af;
  font-size: 14px;
  padding: 10px 0;
}

.radio-group {
  display: flex;
  gap: 8px;
}

.radio-option {
  flex: 1;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  padding: 12px;
  text-align: center;
  cursor: pointer;
}

.radio-option input {
  width: auto;
  margin-right: 5px;
}

.section-note {
  font-size: 12px;
  color: #6b7280;
  margin: -5px 0 12px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>🎲 ボドゲスコア</h1>
  <p>対戦結果を記録して、ゲームごとの自己ベストランキングを作ろう</p>
</header>

<div class="container">

  <!-- 対戦記録 -->
  <div class="card">
    <h2>🎮 対戦を記録</h2>

    <select id="matchGame">
      <option value="">ゲームを選択</option>
    </select>

    <div id="scorePlayers" style="margin-top:12px;"></div>

    <button class="secondary" onclick="addScorePlayer()">
      ＋ プレイヤーを追加
    </button>

    <button style="margin-top:10px;" onclick="recordMatch()">
      対戦を記録する
    </button>
  </div>


  <!-- ゲーム登録 -->
  <div class="card">
    <h2>🎲 ゲームを登録</h2>

    <input id="gameName" placeholder="ゲーム名">

    <p class="section-note">
      このゲームでは、どちらの得点が上位になりますか？
    </p>

    <div class="radio-group">
      <label class="radio-option">
        <input type="radio" name="scoreDirection" value="high" checked>
        高得点が上位
      </label>

      <label class="radio-option">
        <input type="radio" name="scoreDirection" value="low">
        低得点が上位
      </label>
    </div>

    <button style="margin-top:10px;" onclick="registerGame()">
      ゲームを登録
    </button>
  </div>


  <!-- プレイヤー登録 -->
  <div class="card">
    <h2>👤 プレイヤーを登録</h2>

    <div class="row">
      <input id="playerName" placeholder="プレイヤー名">
      <button onclick="registerPlayer()">追加</button>
    </div>

    <div id="playerList" style="margin-top:12px;"></div>
  </div>


  <!-- ゲーム一覧 -->
  <div class="card">
    <h2>📚 ゲーム一覧</h2>
    <div id="gameList"></div>
  </div>


  <!-- ゲーム詳細 -->
  <div class="card hidden" id="gameDetail">
    <h2 id="detailGameName"></h2>
    <div id="detailGameDirection" class="section-note"></div>

    <h3>🏆 個人ベストランキング</h3>
    <div id="bestRanking"></div>

    <h3>📊 ゲーム統計</h3>
    <div id="gameStats"></div>

    <h3>📝 対戦履歴</h3>
    <div id="matchHistory"></div>
  </div>

</div>


<script>

const STORAGE_KEY = "boardgameData";


/* =========================
   データ読み込み・移行
========================= */

let data = loadData();

function loadData() {

  const saved = localStorage.getItem(STORAGE_KEY);

  if (!saved) {
    return {
      players: [],
      games: [],
      matches: []
    };
  }

  try {

    const old = JSON.parse(saved);

    const players = Array.isArray(old.players)
      ? old.players.map(p => {

          if (typeof p === "string") {
            return {
              name: p,
              active: true
            };
          }

          return {
            name: p.name,
            active: p.active !== false
          };

        })
      : [];


    const games = Array.isArray(old.games)
      ? old.games.map(g => {

          if (typeof g === "string") {
            return {
              name: g,
              direction: "high",
              active: true
            };
          }

          return {
            name: g.name,
            direction: g.direction || "high",
            active: g.active !== false
          };

        })
      : [];


    const matches = Array.isArray(old.matches)
      ? old.matches
      : [];


    /*
      過去の対戦記録にしか存在しない
      プレイヤー・ゲームも復元
    */

    matches.forEach(match => {

      if (match.game) {

        const exists = games.some(
          g => g.name === match.game
        );

        if (!exists) {

          games.push({
            name: match.game,
            direction: "high",
            active: false
          });

        }

      }


      if (Array.isArray(match.scores)) {

        match.scores.forEach(score => {

          if (!score.player) return;

          const exists = players.some(
            p => p.name === score.player
          );

          if (!exists) {

            players.push({
              name: score.player,
              active: false
            });

          }

        });

      }

    });


    return {
      players,
      games,
      matches
    };

  } catch (e) {

    console.error(e);

    return {
      players: [],
      games: [],
      matches: []
    };

  }

}


function saveData() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* =========================
   ゲーム登録
========================= */

function registerGame() {

  const input =
    document.getElementById("gameName");

  const name =
    input.value.trim();

  if (!name) {
    alert("ゲーム名を入力してください");
    return;
  }


  const direction =
    document.querySelector(
      'input[name="scoreDirection"]:checked'
    ).value;


  const existing =
    data.games.find(
      g => g.name === name
    );


  if (existing) {

    /*
      以前「登録から外した」ゲームなら
      再登録として復活させる
    */

    existing.active = true;
    existing.direction = direction;

  } else {

    data.games.push({
      name,
      direction,
      active: true
    });

  }


  saveData();

  input.value = "";

  updateAll();

  alert("ゲームを登録しました");

}


/* =========================
   ゲームを登録から外す
========================= */

function archiveGame(name) {

  const game =
    data.games.find(
      g => g.name === name
    );

  if (!game) return;


  if (
    !confirm(
      `${name}を登録一覧から外しますか？\n\n過去の対戦記録は残ります。`
    )
  ) {
    return;
  }


  game.active = false;

  saveData();

  updateAll();

}


/* =========================
   プレイヤー登録
========================= */

function registerPlayer() {

  const input =
    document.getElementById("playerName");

  const name =
    input.value.trim();

  if (!name) {
    alert("プレイヤー名を入力してください");
    return;
  }


  const existing =
    data.players.find(
      p => p.name === name
    );


  if (existing) {

    existing.active = true;

  } else {

    data.players.push({
      name,
      active: true
    });

  }


  saveData();

  input.value = "";

  updateAll();

}


/* =========================
   プレイヤーを登録から外す
========================= */

function archivePlayer(name) {

  const player =
    data.players.find(
      p => p.name === name
    );

  if (!player) return;


  if (
    !confirm(
      `${name}を登録一覧から外しますか？\n\n過去の対戦記録は残ります。`
    )
  ) {
    return;
  }


  player.active = false;

  saveData();

  updateAll();

}


/* =========================
   対戦記録
========================= */

let scorePlayerCount = 0;


function addScorePlayer(
  playerName = "",
  score = ""
) {

  scorePlayerCount++;


  const container =
    document.getElementById(
      "scorePlayers"
    );


  const div =
    document.createElement("div");

  div.className = "player-row";

  div.innerHTML = `

    <select class="match-player">

      <option value="">プレイヤーを選択</option>

      ${data.players
        .filter(p => p.active)
        .map(p =>
          `<option value="${escapeHTML(p.name)}"
            ${p.name === playerName ? "selected" : ""}>
            ${escapeHTML(p.name)}
          </option>`
        )
        .join("")
      }

    </select>

    <input
      class="match-score"
      type="number"
      placeholder="得点"
      value="${score}"
    >

    <button
      class="small danger"
      onclick="this.parentElement.remove()"
    >
      ×
    </button>

  `;


  container.appendChild(div);

}


function recordMatch() {

  const gameName =
    document.getElementById(
      "matchGame"
    ).value;


  if (!gameName) {

    alert("ゲームを選択してください");

    return;

  }


  const rows =
    document.querySelectorAll(
      "#scorePlayers .player-row"
    );


  if (rows.length === 0) {

    alert("プレイヤーを追加してください");

    return;

  }


  const scores = [];


  for (const row of rows) {

    const player =
      row.querySelector(
        ".match-player"
      ).value;


    const scoreText =
      row.querySelector(
        ".match-score"
      ).value;


    if (!player || scoreText === "") {

      alert(
        "プレイヤーと得点を入力してください"
      );

      return;

    }


    scores.push({

      player,

      score: Number(scoreText)

    });

  }


  data.matches.push({

    id: Date.now(),

    date:
      new Date().toISOString(),

    game: gameName,

    scores

  });


  saveData();


  document.getElementById(
    "scorePlayers"
  ).innerHTML = "";

  scorePlayerCount = 0;

  addScorePlayer();


  alert("対戦結果を記録しました");

  updateAll();

}


/* =========================
   ゲーム一覧
========================= */

function renderGameList() {

  const container =
    document.getElementById(
      "gameList"
    );


  const activeGames =
    data.games.filter(
      g => g.active
    );


  if (activeGames.length === 0) {

    container.innerHTML =
      `<div class="empty">
        まだゲームが登録されていません
      </div>`;

    return;

  }


  container.innerHTML =
    activeGames.map(game => {

      const matchCount =
        data.matches.filter(
          m => m.game === game.name
        ).length;


      const direction =
        game.direction === "high"
          ? "高得点が上位"
          : "低得点が上位";


      return `

        <div
          class="game-item"
          onclick="showGameDetail('${escapeJS(game.name)}')"
          style="cursor:pointer;"
        >

          <div class="row">

            <div>
              <div class="game-title">
                ${escapeHTML(game.name)}
              </div>

              <div class="game-meta">
                ${direction}
                ／
                ${matchCount}回対戦
              </div>
            </div>

            <button
              class="small danger"
              onclick="
                event.stopPropagation();
                archiveGame('${escapeJS(game.name)}')
              "
            >
              登録から外す
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   プレイヤー一覧
========================= */

function renderPlayerList() {

  const container =
    document.getElementById(
      "playerList"
    );


  const activePlayers =
    data.players.filter(
      p => p.active
    );


  if (activePlayers.length === 0) {

    container.innerHTML =
      `<div class="empty">
        まだプレイヤーが登録されていません
      </div>`;

    return;

  }


  container.innerHTML =
    activePlayers.map(p => `

      <div class="row"
           style="margin-bottom:8px;">

        <div>
          ${escapeHTML(p.name)}
        </div>

        <button
          class="small danger"
          onclick="
            archivePlayer('${escapeJS(p.name)}')
          "
        >
          登録から外す
        </button>

      </div>

    `).join("");

}


/* =========================
   ゲーム選択
========================= */

function renderGameSelect() {

  const select =
    document.getElementById(
      "matchGame"
    );


  const current =
    select.value;


  const activeGames =
    data.games.filter(
      g => g.active
    );


  select.innerHTML =
    `<option value="">
      ゲームを選択
    </option>`;


  activeGames.forEach(game => {

    const option =
      document.createElement("option");

    option.value =
      game.name;

    option.textContent =
      game.name;

    select.appendChild(option);

  });


  if (
    activeGames.some(
      g => g.name === current
    )
  ) {

    select.value = current;

  }

}


/* =========================
   ゲーム詳細
========================= */

function showGameDetail(gameName) {

  const game =
    data.games.find(
      g => g.name === gameName
    );


  if (!game) return;


  document.getElementById(
    "gameDetail"
  ).classList.remove("hidden");


  document.getElementById(
    "detailGameName"
  ).textContent =
    gameName;


  document.getElementById(
    "detailGameDirection"
  ).textContent =
    game.direction === "high"
      ? "高得点が上位"
      : "低得点が上位";


  renderBestRanking(
    gameName,
    game.direction
  );


  renderGameStats(
    gameName
  );


  renderMatchHistory(
    gameName
  );

}


/* =========================
   個人ベストランキング
========================= */

function renderBestRanking(
  gameName,
  direction
) {

  const container =
    document.getElementById(
      "bestRanking"
    );


  const matches =
    data.matches.filter(
      m => m.game === gameName
    );


  const bestScores = {};


  matches.forEach(match => {

    match.scores.forEach(item => {

      const player =
        item.player;

      const score =
        Number(item.score);


      if (
        bestScores[player] === undefined
      ) {

        bestScores[player] =
          score;

      } else {

        if (direction === "high") {

          if (
            score >
            bestScores[player]
          ) {
            bestScores[player] =
              score;
          }

        } else {

          if (
            score <
            bestScores[player]
          ) {
            bestScores[player] =
              score;
          }

        }

      }

    });

  });


  const ranking =
    Object.entries(bestScores)
      .sort((a, b) => {

        if (direction === "high") {

          return b[1] - a[1];

        } else {

          return a[1] - b[1];

        }

      });


  if (ranking.length === 0) {

    container.innerHTML =
      `<div class="empty">
        まだ対戦記録がありません
      </div>`;

    return;

  }


  container.innerHTML =
    `<div class="rank-list">

      ${
        ranking.map(
          ([player, score], index) => `

            <div class="rank-item">

              <div class="rank-number">
                ${index + 1}位
              </div>

              <div class="rank-player">
                ${escapeHTML(player)}
              </div>

              <div class="rank-score">
                ${score}点
              </div>

            </div>

          `
        ).join("")
      }

    </div>`;

}


/* =========================
   ゲーム統計
========================= */

function renderGameStats(
  gameName
) {

  const container =
    document.getElementById(
      "gameStats"
    );


  const matches =
    data.matches.filter(
      m => m.game === gameName
    );


  const players =
    new Set();


  matches.forEach(match => {

    match.scores.forEach(
      item =>
        players.add(
          item.player
        )
    );

  });


  container.innerHTML = `

    <div>
      対戦回数：
      <strong>${matches.length}</strong>回
    </div>

    <div style="margin-top:5px;">
      参加プレイヤー：
      <strong>${players.size}</strong>人
    </div>

  `;

}


/* =========================
   対戦履歴
========================= */

function renderMatchHistory(
  gameName
) {

  const container =
    document.getElementById(
      "matchHistory"
    );


  const matches =
    data.matches
      .filter(
        m => m.game === gameName
      )
      .sort(
        (a, b) =>
          new Date(b.date) -
          new Date(a.date)
      );


  if (matches.length === 0) {

    container.innerHTML =
      `<div class="empty">
        まだ対戦記録がありません
      </div>`;

    return;

  }


  container.innerHTML =
    matches.map(match => {

      const date =
        new Date(
          match.date
        ).toLocaleDateString(
          "ja-JP",
          {
            year: "numeric",
            month: "numeric",
            day: "numeric"
          }
        );


      const scores =
        [...match.scores]
          .sort(
            (a, b) =>
              b.score - a.score
          );


      return `

        <div class="history-item">

          <div class="history-date">
            ${date}
          </div>

          ${
            scores.map(
              item => `

                <div class="history-score">

                  <span>
                    ${escapeHTML(item.player)}
                  </span>

                  <strong>
                    ${item.score}点
                  </strong>

                </div>

              `
            ).join("")
          }

        </div>

      `;

    }).join("");

}


/* =========================
   全体更新
========================= */

function updateAll() {

  renderGameSelect();

  renderGameList();

  renderPlayerList();

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(str) {

  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeJS(str) {

  return String(str)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");

}


/* =========================
   初期化
========================= */

updateAll();

addScorePlayer();

</script>

</body>
</html>
