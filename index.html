<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="theme-color" content="#111827">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ボドゲスコア</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",

  background: #f3f4f6;

}

header {

  padding: 20px;
}

header h1 {
  margin: 0;

}

header p {

}

.container {

  margin: auto;

}

.card {
  background: white;

}

select,

input,

button {

button.secondary {

button.danger {

.game-title {

.game-meta {

}

.rank-list {
  margin-top: 10px;
}

.rank-item {
  display: flex;
  align-items: center;

}

.rank-number {
  width: 42px;
  font-weight: bold;
  text-align: center;
}

.rank-player {
  flex: 1;
}

.rank-score {
  font-weight: bold;
  font-size: 17px;
}

.history-item {
  padding: 12px 0;

}

.history-date {
  font-size: 12px;

}

.history-score {

}

.history-winner {
  font-weight: bold;
}

.empty {

  font-size: 14px;

}

.radio-group {
  display: flex;

}

.radio-option {
  flex: 1;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  padding: 12px;
  text-align: center;
  cursor: pointer;
}

.radio-option input {
  width: auto;
  margin-right: 5px;
}

.section-note {
  font-size: 12px;
  color: #6b7280;
  margin: -5px 0 12px;
}

.hidden {
  display: none;
}

.screen {
  max-width: 700px;
  margin: auto;
  padding: 24px 16px;
}

.screen button {
  margin-bottom: 12px;
}

.screenContent {
  display: none;
}

.screenContent.active {
  display: block;
}

.stat-box {
  background: #f9fafb;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
}

.stat-label {
  font-size: 12px;
  color: #6b7280;
}

.stat-value {
  font-size: 20px;
  font-weight: bold;
  margin-top: 3px;
}

.player-detail-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
}

.backup-buttons {
  display: flex;
  gap: 8px;
}

.backup-buttons button {
  flex: 1;
}

#fileInput {
  display: none;
}
</style>
</head>

<body>

  <button onclick="randomSelectGame()">🎲 ランダムでゲームを決める</button>

</div>
    
      <div id="previousMembersArea" style="margin-top:10px;"></div>

  <!-- ゲーム登録 -->
  <div class="card">

    <input id="gameName" placeholder="ゲーム名">

    <p class="section-note">

    <div class="radio-group">
      <label class="radio-option">
        <input type="radio"

</div>

<div class="card">

</div>

</select>

    <div class="backup-buttons">

      <button onclick="exportData()">
        データを書き出す

        データを復元
      </button>

    >

</div>

<script>

const STORAGE_KEY = "boardgameData";


/* =========================
   データ読み込み
========================= */

let data = loadData();


function loadData() {

  const saved =
    localStorage.getItem(STORAGE_KEY);

  if (!saved) {

    return {
      players: [],
      games: [],
      matches: []
    };

  }


  try {

    const old =
      JSON.parse(saved);


    const players =
      Array.isArray(old.players)
        ? old.players.map(p => {

            if (typeof p === "string") {

              return {
                name: p,
                active: true
              };

            }

            return {
              name: p.name,
              active:
                p.active !== false
            };

          })
        : [];


    const games =
      Array.isArray(old.games)
        ? old.games.map(g => {

            if (typeof g === "string") {

              return {
                name: g,
                direction: "high",
                active: true
              };

            }

            return {
              name: g.name,
              direction:
                g.direction || "high",
              active:
                g.active !== false
            };

          })
        : [];


    const matches =
      Array.isArray(old.matches)
        ? old.matches
        : [];


    /*
      過去記録にしか存在しない
      プレイヤー・ゲームも復元
    */

    matches.forEach(match => {

      if (match.game) {

        const exists =
          games.some(
            g => g.name === match.game
          );


        if (!exists) {

          games.push({
            name: match.game,
            direction: "high",
            active: false
          });

        }

      }


      if (Array.isArray(match.scores)) {

        match.scores.forEach(item => {

          if (!item.player) return;


          const exists =
            players.some(
              p => p.name === item.player
            );


          if (!exists) {

            players.push({
              name: item.player,
              active: false
            });

          }

        });

      }

    });


    return {
      players,
      games,
      matches
    };


  } catch (e) {

    console.error(e);

    return {
      players: [],
      games: [],
      matches: []
    };

  }

}


function saveData() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* =========================
   ゲーム登録
========================= */

function registerGame() {

  const input =
    document.getElementById("gameName");


  const name =
    input.value.trim();


  if (!name) {

    alert("ゲーム名を入力してください");

    return;

  }


  const direction =
    document.querySelector(
      'input[name="scoreDirection"]:checked'
    ).value;


  const existing =
    data.games.find(
      g => g.name === name
    );


  if (existing) {

    existing.active = true;
    existing.direction = direction;

  } else {

    data.games.push({

      name,
      direction,
      active: true

    });

  }


  saveData();

  input.value = "";

  updateAll();

  alert("ゲームを登録しました");

}


/* =========================
   ゲームを登録から外す
========================= */

function archiveGame(name) {

  const game =
    data.games.find(
      g => g.name === name
    );


  if (!game) return;


  if (
    !confirm(
      `${name}を登録一覧から外しますか？\n\n過去の対戦記録は残ります。`
    )
  ) {

    return;

  }


  game.active = false;

  saveData();

  updateAll();

}


/* =========================
   プレイヤー登録
========================= */

function registerPlayer() {

  const input =
    document.getElementById("playerName");


  const name =
    input.value.trim();


  if (!name) {

    alert("プレイヤー名を入力してください");

    return;

  }


  const existing =
    data.players.find(
      p => p.name === name
    );


  if (existing) {

    existing.active = true;

  } else {

    data.players.push({

      name,
      active: true

    });

  }


  saveData();

  input.value = "";

  updateAll();

}


/* =========================
   プレイヤーを登録から外す
========================= */

function archivePlayer(name) {

  const player =
    data.players.find(
      p => p.name === name
    );


  if (!player) return;


  if (
    !confirm(
      `${name}を登録一覧から外しますか？\n\n過去の対戦記録は残ります。`
    )
  ) {

    return;

  }


  player.active = false;

  saveData();

  updateAll();

}


/* =========================
   対戦記録入力
========================= */

function addScorePlayer(
  playerName = "",
  score = ""
) {

  const container =
    document.getElementById(
      "scorePlayers"
    );


  const div =
    document.createElement("div");


  div.className =
    "player-row";


  const select =
    document.createElement("select");

  select.className =
    "match-player";


  const defaultOption =
    document.createElement("option");

  defaultOption.value = "";
  defaultOption.textContent =
    "プレイヤーを選択";


  select.appendChild(
    defaultOption
  );


  data.players
    .filter(p => p.active)
    .forEach(p => {

      const option =
        document.createElement("option");

      option.value =
        p.name;

      option.textContent =
        p.name;

      if (p.name === playerName) {

        option.selected = true;

      }

      select.appendChild(option);

    });


  const input =
    document.createElement("input");

  input.className =
    "match-score";

  input.type =
    "number";

  input.placeholder =
    "得点";

  input.value =
    score;


  const remove =
    document.createElement("button");

  remove.className =
    "small danger";

  remove.textContent =
    "×";

  remove.type =
    "button";

  remove.onclick = () =>
    div.remove();


  div.appendChild(select);
  div.appendChild(input);
  div.appendChild(remove);

  container.appendChild(div);

}


/* =========================
   対戦を記録
========================= */

function recordMatch() {

  const gameName =
    document.getElementById(
      "matchGame"
    ).value;

  const matchDate =
  document.getElementById("matchDate").value;

if (!matchDate) {
  alert("対戦日を入力してください");
  return;
}

  if (!gameName) {

    alert("ゲームを選択してください");

    return;

  }


  const rows =
    document.querySelectorAll(
      "#scorePlayers .player-row"
    );


  if (rows.length === 0) {

    alert(
      "プレイヤーを追加してください"
    );

    return;

  }


  const scores = [];

  const usedPlayers = new Set();


  for (const row of rows) {

    const player =
      row.querySelector(
        ".match-player"
      ).value;


    const scoreText =
      row.querySelector(
        ".match-score"
      ).value;


    if (!player || scoreText === "") {

      alert(
        "プレイヤーと得点を入力してください"
      );

      return;

    }


    if (usedPlayers.has(player)) {

      alert(
        `${player}が重複しています`
      );

      return;

    }


    usedPlayers.add(player);


    scores.push({

      player,

      score: Number(scoreText)

    });

  }


  const game =
    data.games.find(
      g => g.name === gameName
    );


  const direction =
    game
      ? game.direction
      : "high";


  /*
    勝者を自動判定
  */

  let bestScore =
    direction === "high"
      ? -Infinity
      : Infinity;


  scores.forEach(item => {

    if (direction === "high") {

      if (item.score > bestScore) {

        bestScore =
          item.score;

      }

    } else {

      if (item.score < bestScore) {

        bestScore =
          item.score;

      }

    }

  });


  scores.forEach(item => {

    item.winner =
      item.score === bestScore;

  });


  const wasEditing =
  window.editingMatchId !== null &&
  window.editingMatchId !== undefined;

if (wasEditing) {

  const matchIndex =
    data.matches.findIndex(
      m => m.id === window.editingMatchId
    );

  if (matchIndex !== -1) {

    data.matches[matchIndex] = {
  ...data.matches[matchIndex],
  date: new Date(matchDate + "T12:00:00").toISOString(),
  game: gameName,
  scores
};

  }

  window.editingMatchId = null;

const recordButton = document.querySelector(
  'button[onclick="recordMatch()"]'
);

if (recordButton) {
  recordButton.textContent = "対戦を記録する";
}

} else {

  data.matches.push({
  id: Date.now(),
  date: new Date(matchDate + "T12:00:00").toISOString(),
  game: gameName,
  scores
});

}


  saveData();


  document.getElementById(
    "scorePlayers"
  ).innerHTML = "";


  addScorePlayer();


  alert(
    "対戦結果を記録しました！"
  );


  updateAll();

}


/* =========================
   ゲーム選択
========================= */

function renderGameSelect() {

  const select =
    document.getElementById(
      "matchGame"
    );

  if (!select) return;


  const current =
    select.value;


  select.innerHTML =
    `<option value="">
      ゲームを選択
    </option>`;


  data.games
    .filter(g => g.active)
    .forEach(game => {

      const option =
        document.createElement("option");

      option.value =
        game.name;

      option.textContent =
        game.name;

      select.appendChild(option);

    });


  if (
    data.games.some(
      g =>
        g.active &&
        g.name === current
    )
  ) {

    select.value = current;

  }

}


/* =========================
   対戦入力中のプレイヤー選択肢を更新
========================= */

function refreshMatchPlayerSelects() {

  const selects =
    document.querySelectorAll(
      "#scorePlayers .match-player"
    );


  selects.forEach(select => {

    const current =
      select.value;


    select.innerHTML = "";


    const defaultOption =
      document.createElement("option");

    defaultOption.value = "";

    defaultOption.textContent =
      "プレイヤーを選択";


    select.appendChild(
      defaultOption
    );


    data.players
      .filter(p => p.active)
      .forEach(player => {

        const option =
          document.createElement("option");

        option.value =
          player.name;

        option.textContent =
          player.name;


        if (
          player.name === current
        ) {

          option.selected = true;

        }


        select.appendChild(
          option
        );

      });

  });

}

/* =========================
   前回のメンバー
========================= */

function renderPreviousMembers() {

  const container =
    document.getElementById(
      "previousMembersArea"
    );

  if (!container) return;

  container.innerHTML = "";

  /*
    直近の対戦記録を取得
    ゲームは問わない
  */

  if (
    !Array.isArray(data.matches) ||
    data.matches.length === 0
  ) {
    return;
  }

  const latestMatch =
    [...data.matches].sort(
      (a, b) =>
        new Date(b.date) -
        new Date(a.date)
    )[0];

  if (
    !latestMatch ||
    !Array.isArray(latestMatch.scores) ||
    latestMatch.scores.length === 0
  ) {
    return;
  }

  const button =
    document.createElement("button");

  button.type = "button";
  button.className = "secondary";

  button.textContent =
    "🔄 前回のメンバーを使用";

  button.onclick = () => {

  const currentRows =
    document.querySelectorAll(
      "#scorePlayers .player-row"
    );

  const hasInput =
    Array.from(currentRows).some(row => {

      const player =
        row.querySelector(
          ".match-player"
        ).value;

      const score =
        row.querySelector(

function randomSelectGame() {

  const games =
    data.games.filter(game => game.active);

  if (games.length === 0) {
    alert("登録されているゲームがありません。");
    return;
  }

  const gameSelect =
    document.getElementById("matchGame");

  let count = 0;
  const totalCount = 20;

  const roulette =
    setInterval(() => {

      const randomIndex =
        Math.floor(Math.random() * games.length);

      const game =
        games[randomIndex];

      if (gameSelect) {
        gameSelect.value = game.name;
      }

      count++;

      if (count >= totalCount) {

        clearInterval(roulette);

        const finalIndex =
          Math.floor(Math.random() * games.length);

        const selectedGame =
          games[finalIndex];

        if (gameSelect) {
          gameSelect.value =
            selectedGame.name;
        }

        setTimeout(() => {

          alert(
            `🎲 今日のゲームは……\n\n「${selectedGame.name}」！`
          );

        }, 300);

      }

    }, 80);

  showScreen("recordScreen");

}

function renderAverageRankRanking() {

    document.getElementById("averageRankRanking");

  if (!container) return;

  container.innerHTML = "";

  const ranking =
    data.players
      .filter(player => player.active)
      .map(player => {

        const matches =
          getPlayerMatches(player.name);

        let rankTotal = 0;

        matches.forEach(match => {

          const game =
            data.games.find(
              g => g.name === match.game
            );

          if (!game || !Array.isArray(match.scores)) {
            return;
          }

          const scores =
            match.scores.map(item => ({
              player: item.player,
              score: Number(item.score)
            }));

          const sorted =
            [...scores].sort((a, b) => {

              if (game.direction === "high") {
                return b.score - a.score;
              }

              return a.score - b.score;

            });

          const playerIndex =
            sorted.findIndex(
              item => item.player === player.name
            );

          if (playerIndex !== -1) {

            rankTotal += playerIndex + 1;

          }

        });

        const averageRank =
          matches.length > 0
            ? rankTotal / matches.length
            : 0;

        return {
          name: player.name,
          matches: matches.length,
          averageRank: averageRank
        };

      })
      .filter(player =>
        player.matches > 0
      )
      .sort((a, b) => {

function renderBestRanking(
  gameName,
  direction
) {

  const container =
    document.getElementById(
      "bestRanking"
    );


  const matches =
    data.matches.filter(
      m => m.game === gameName
    );


  const bestScores = {};


  matches.forEach(match => {

    match.scores.forEach(item => {

      const player =
        item.player;

      const score =
        Number(item.score);


      if (
        bestScores[player] === undefined
      ) {

        bestScores[player] =
          score;

      } else if (
        direction === "high" &&
        score > bestScores[player]
      ) {

        bestScores[player] =
          score;

      } else if (
        direction === "low" &&
        score < bestScores[player]
      ) {

        bestScores[player] =
          score;

      }

    });

  });


  const ranking =
    Object.entries(bestScores)
      .sort((a, b) => {

        return direction === "high"
          ? b[1] - a[1]
          : a[1] - b[1];

      });


  if (ranking.length === 0) {

    container.innerHTML =
      `<div class="empty">
        まだ対戦記録がありません
      </div>`;

    return;

  }


  let previousScore = null;
  let currentRank = 0;


  container.innerHTML = "";


  ranking.forEach(
    ([player, score], index) => {

      if (score !== previousScore) {

        currentRank =
          index + 1;

        previousScore =
          score;

      }


      const item =
        document.createElement("div");

      item.className =
        "rank-item";


      const number =
        document.createElement("div");

      number.className =
        "rank-number";

      number.textContent =
        `${currentRank}位`;


      const playerDiv =
        document.createElement("div");

      playerDiv.className =
        "rank-player";

      playerDiv.textContent =
        player;


      const scoreDiv =
        document.createElement("div");

      scoreDiv.className =
        "rank-score";

      scoreDiv.textContent =
        `${score}点`;


      item.appendChild(number);
      item.appendChild(playerDiv);
      item.appendChild(scoreDiv);


      container.appendChild(item);

    }
  );

}

function renderGameStats(gameName) {

  const container =
    document.getElementById(
      "gameStats"
    );


  const matches =
    data.matches.filter(
      m => m.game === gameName
    );


  const players =
    new Set();


  let totalScores = 0;
  let scoreCount = 0;


  matches.forEach(match => {

    match.scores.forEach(item => {

      players.add(item.player);

      totalScores +=
        Number(item.score);

      scoreCount++;

    });

  const average =
    scoreCount > 0
      ? (totalScores / scoreCount).toFixed(1)
      : "-";


  container.innerHTML = `

function showPlayerDetail(playerName) {

  document.getElementById(
    "playerDetail"
  ).classList.remove("hidden");


  document.getElementById(
    "gameDetail"
  ).classList.add("hidden");


  document.getElementById(
    "detailPlayerName"
  ).textContent =
    `👤 ${playerName}`;


  const matches =
    getPlayerMatches(playerName);


  let wins = 0;
  let totalScore = 0;


  const gameStats = {};


  matches.forEach(match => {

    const item =
      match.scores.find(
        s =>
          s.player === playerName
      );


    if (!item) return;


    totalScore +=
      Number(item.score);


    if (
      isWinner(
        match,
        playerName
      )
    ) {

      wins++;

    }


    if (!gameStats[match.game]) {

      gameStats[match.game] = {

        matches: 0,
        wins: 0,
        best: null

      };

    }


    gameStats[match.game].matches++;


    if (
      isWinner(
        match,
        playerName
      )
    ) {

      gameStats[match.game].wins++;

    }


    const game =
      data.games.find(
        g => g.name === match.game
      );


    const direction =
      game
        ? game.direction
        : "high";


    const best =
      gameStats[match.game].best;


    if (
      best === null ||
      (
        direction === "high" &&
        item.score > best
      ) ||
      (
        direction === "low" &&
        item.score < best
      )
    ) {

      gameStats[match.game].best =
        Number(item.score);

    }

  });


  const average =
    matches.length > 0
      ? (
          totalScore /
          matches.length
        ).toFixed(1)
      : "-";


  const winRate =
    matches.length > 0
      ? (
          wins /
          matches.length *
          100
        ).toFixed(1)
      : "0.0";


  const container =
    document.getElementById(
      "playerDetailStats"
    );


  let html = `

    <div class="stat-box">
      <div class="stat-label">
        総対戦数
      </div>
      <div class="stat-value">
        ${matches.length}戦
      </div>
    </div>

    <div class="stat-box">
      <div class="stat-label">
        1位回数
      </div>
      <div class="stat-value">
        ${wins}勝
      </div>
    </div>

    <div class="stat-box">
      <div class="stat-label">
        勝率
      </div>
      <div class="stat-value">
        ${winRate}%
      </div>
    </div>

    <div class="stat-box">
      <div class="stat-label">
        平均得点
      </div>
      <div class="stat-value">
        ${average}点
      </div>
    </div>

    <h3>ゲーム別戦績</h3>

  `;


  const games =
    Object.entries(
      gameStats
    );


  if (games.length === 0) {

    html +=
      `<div class="empty">
        まだ対戦記録がありません
      </div>`;

  } else {

    games.forEach(
      ([gameName, stats]) => {

        const rate =
          stats.matches > 0
            ? (
                stats.wins /
                stats.matches *
                100
              ).toFixed(1)
            : "0.0";


        html += `

          <div class="stat-box">

            <strong>
              ${escapeHTML(gameName)}
            </strong>

            <div style="margin-top:6px;">
              ${stats.matches}戦
              ／
              ${stats.wins}勝
              ／
              勝率 ${rate}%
            </div>

            <div style="margin-top:4px;">
              ベスト：
              <strong>
                ${stats.best}点
              </strong>
            </div>

          </div>

        `;

      }
    );

  }


  container.innerHTML =
    html;

}


/* =========================
   プレイヤーの対戦取得
========================= */

function getPlayerMatches(
  playerName
) {

  return data.matches.filter(
    match =>
      Array.isArray(match.scores) &&
      match.scores.some(
        s =>
          s.player ===
          playerName
      )
  );

}


/* =========================
   勝者判定
========================= */

function isWinner(
  match,
  playerName
) {

  const game =
    data.games.find(
      g => g.name === match.game
    );


  const direction =
    game
      ? game.direction
      : "high";


  const item =
    match.scores.find(
      s =>
        s.player === playerName
    );


  if (!item) return false;


  const scores =
    match.scores.map(
      s => Number(s.score)
    );


  const best =
    direction === "high"
      ? Math.max(...scores)
      : Math.min(...scores);


  return Number(item.score) === best;

}


/* =========================

========================= */

function exportData() {

  const json =
    JSON.stringify(
      data,
      null,
      2
    );


  const blob =
    new Blob(
      [json],
      {
        type: "application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  const date =
    new Date()
      .toISOString()
      .slice(0, 10);


  a.href = url;

  a.download =
    `boardgame-backup-${date}.json`;


  a.click();


  URL.revokeObjectURL(url);


  alert(
    "バックアップファイルを書き出しました！"
  );

}


/* =========================
   バックアップ復元
========================= */

function importData(event) {

  const file =
    event.target.files[0];


  if (!file) return;


  if (
    !confirm(
      "現在のデータをバックアップデータで置き換えます。\n\nよろしいですか？"
    )
  ) {

    event.target.value = "";

    return;

  }


  const reader =
    new FileReader();


  reader.onload = function(e) {

    try {

      const imported =
        JSON.parse(
          e.target.result
        );


      if (
        !imported ||
        !Array.isArray(
          imported.players
        ) ||
        !Array.isArray(
          imported.games
        ) ||
        !Array.isArray(
          imported.matches
        )
      ) {

        throw new Error(
          "形式が違います"
        );

      }


      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(imported)
      );


      data =
        loadData();


      updateAll();


      document.getElementById(
        "scorePlayers"
      ).innerHTML = "";


      addScorePlayer();


      alert(
        "データを復元しました！"
      );


    } catch (error) {

      alert(
        "バックアップファイルを読み込めませんでした。"
      );

      console.error(error);

    }


    event.target.value = "";

  };


  reader.readAsText(file);

}

/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(str) {

  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

function editMatch(matchId) {

  const match =

      m => m.id === matchId

  if (!match) return;

  const wrapper =
    document.querySelector(
      `.history-item[data-match-id="${matchId}"]`

  if (!wrapper) return;

  const game =
    data.games.find(
      g => g.name === match.game

      ? game.direction

  const title =

  title.textContent =
    "✏️ 対戦結果を編集中";

  title.style.fontWeight =
    "bold";

  title.style.marginBottom =
    "10px";

  wrapper.appendChild(title);


  // 対戦日
  const dateLabel =
    document.createElement("label");

  dateLabel.textContent =
    "📅 対戦日";

  dateLabel.className =
    "section-note";

  wrapper.appendChild(dateLabel);


  const dateInput =
    document.createElement("input");

  dateInput.type =
    "date";

  dateInput.value =
    new Date(match.date)
      .toLocaleDateString("en-CA");

  wrapper.appendChild(dateInput);


  // プレイヤー入力欄
  const playersArea =
    document.createElement("div");

  playersArea.style.marginTop =
    "12px";

  wrapper.appendChild(playersArea);


  function addEditPlayer(
    playerName = "",
    score = ""
  ) {

    const row =
      document.createElement("div");

    row.className =
      "player-row";

    const select =
      document.createElement("select");

    select.className =
      "match-player";

    const defaultOption =
      document.createElement("option");

    defaultOption.value = "";

    defaultOption.textContent =
      "プレイヤーを選択";

    select.appendChild(
      defaultOption
    );


    data.players
      .filter(p => p.active || p.name === playerName)
      .forEach(p => {

        const option =
          document.createElement("option");

        option.value =
          p.name;

        option.textContent =
          p.name;

        if (p.name === playerName) {
          option.selected = true;
        }

        select.appendChild(option);

      });


    const scoreInput =
      document.createElement("input");

    scoreInput.type =
      "number";

    scoreInput.className =
      "match-score";

    scoreInput.placeholder =
      "得点";

    scoreInput.value =
      score;


    const removeButton =
      document.createElement("button");

    removeButton.type =
      "button";

    removeButton.className =
      "small danger";

    removeButton.textContent =
      "×";

    removeButton.onclick = () => {
      row.remove();
    };


    row.appendChild(select);
    row.appendChild(scoreInput);
    row.appendChild(removeButton);

    playersArea.appendChild(row);

  }


  match.scores.forEach(item => {

    addEditPlayer(
      item.player,
      item.score
    );

  });


  // プレイヤー追加
  const addButton =
    document.createElement("button");

  addButton.type =
    "button";

  addButton.className =
    "secondary";

  addButton.textContent =
    "＋ プレイヤーを追加";

  addButton.style.marginTop =
    "8px";

  addButton.onclick = () => {
    addEditPlayer();
  };

  wrapper.appendChild(addButton);


  // キャンセル
  const cancelButton =
    document.createElement("button");

  cancelButton.type =
    "button";

  cancelButton.className =
    "secondary";

  cancelButton.textContent =
    "キャンセル";

  cancelButton.style.marginTop =
    "8px";

  cancelButton.onclick = () => {

    renderMatchHistory(
      match.game
    );

  };

  wrapper.appendChild(cancelButton);


  // 更新
  const updateButton =
    document.createElement("button");

  updateButton.type =
    "button";

  updateButton.textContent =
    "更新する";

  updateButton.style.marginTop =
    "8px";

  updateButton.onclick = () => {

    const rows =
      playersArea.querySelectorAll(
        ".player-row"
      );

    if (rows.length === 0) {

      alert(
        "プレイヤーを追加してください"
      );

      return;

    }


    if (!dateInput.value) {

      alert(
        "対戦日を入力してください"
      );

      return;

    }


    const scores = [];

    const usedPlayers =
      new Set();


    for (const row of rows) {

      const player =
        row.querySelector(
          ".match-player"
        ).value;

      const scoreText =
        row.querySelector(
          ".match-score"
        ).value;


      if (
        !player ||
        scoreText === ""
      ) {

        alert(
          "プレイヤーと得点を入力してください"
        );

        return;

      }


      if (
        usedPlayers.has(player)
      ) {

        alert(
          `${player}が重複しています`
        );

        return;

      }


      usedPlayers.add(player);


      scores.push({

        player,

        score:
          Number(scoreText)

      });

    }


    let bestScore =
      direction === "high"
        ? -Infinity
        : Infinity;


    scores.forEach(item => {

      if (
        direction === "high"
      ) {

        if (
          item.score > bestScore
        ) {
          bestScore =
            item.score;
        }

      } else {

        if (
          item.score < bestScore
        ) {
          bestScore =
            item.score;
        }

      }

    });


    scores.forEach(item => {

      item.winner =
        item.score === bestScore;

    });


    match.date =
      new Date(
        dateInput.value +
        "T12:00:00"
      ).toISOString();

    match.scores =
      scores;


            saveData();

    // ゲーム詳細をすべて最新状態に更新
    renderBestRanking(
      match.game,
      direction
    );

    renderGameStats(
      match.game
    );

    renderMatchHistory(
      match.game
    );

    // ゲーム一覧・プレイヤー戦績も更新
    renderGameList();

    renderPlayerStatsList();

  };

  wrapper.appendChild(
    updateButton
  );

}

/* =========================
   画面切り替え
========================= */

function showScreen(screenName) {

  const home =
    document.getElementById("homeScreen");

  const main =
    document.getElementById("mainContent");

  const screens =
    document.querySelectorAll(".screenContent");


  /* ホーム画面 */

  if (screenName === "homeScreen") {

    home.classList.remove("hidden");

    main.classList.add("hidden");

    screens.forEach(screen => {
      screen.classList.remove("active");
    });

    return;

  }


  /* ホームを隠す */

  home.classList.add("hidden");

  main.classList.remove("hidden");


  /* すべての画面を隠す */

  screens.forEach(screen => {
    screen.classList.remove("active");
  });


  /* 選択した画面 */

  const target =
    document.getElementById(screenName);

  if (target) {
    target.classList.add("active");
  }


  /* =========================
     画面を開いた時に最新状態へ更新
  ========================= */


  // 対戦記録画面
  if (screenName === "recordScreen") {

    renderGameSelect();

    renderPreviousMembers();

    // 新規記録時だけ今日の日付を入れる
    const dateInput =
      document.getElementById("matchDate");

    if (
      dateInput &&
      !window.editingMatchId
    ) {

      dateInput.value =
        new Date().toLocaleDateString(
          "en-CA"
        );

    }

  }


  // ランキング画面
  if (screenName === "rankingScreen") {

  renderGameList();

  renderPlayerStatsList();

  renderWinRateRanking();

  renderWinCountRanking();

  renderStreakRanking();

  renderAverageRankRanking();

  renderHeadToHeadPlayerSelect();

  renderHeadToHeadRanking();

}


  // 情報登録画面
  if (screenName === "infoScreen") {

    renderPlayerList();

  }


  // データ管理画面
  if (screenName === "backupScreen") {

    // 現時点では更新処理なし

  }

}
