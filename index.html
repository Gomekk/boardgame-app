<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>ボドゲスコア</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f3f5;
  color:#171717;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  -webkit-tap-highlight-color:transparent;
}

header{
  background:#111;
  color:white;
  padding:20px 18px 18px;
  font-size:22px;
  font-weight:800;
  position:sticky;
  top:0;
  z-index:10;
}

main{
  max-width:650px;
  margin:auto;
  padding:16px 14px 40px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}

h2{
  margin:0 0 14px;
  font-size:20px;
}

h3{
  margin:0 0 8px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  background:#fafafa;
  outline:none;
}

input:focus{
  border-color:#111;
  background:white;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:9px;
  font-size:16px;
  font-weight:700;
  background:#111;
  color:white;
}

button.secondary{
  background:#eee;
  color:#222;
}

button.game{
  background:white;
  color:#111;
  border:1px solid #e3e3e3;
  text-align:left;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

button:active{
  transform:scale(.98);
}

.player-row{
  display:grid;
  grid-template-columns:1fr 105px;
  gap:8px;
  margin-bottom:8px;
}

.section-title{
  font-size:13px;
  color:#777;
  font-weight:700;
  margin-bottom:8px;
}

.game-name{
  font-size:17px;
  font-weight:700;
}

.game-meta{
  font-size:13px;
  color:#777;
  margin-top:4px;
}

.arrow{
  color:#aaa;
  font-size:20px;
}

.ranking-row{
  display:grid;
  grid-template-columns:45px 1fr auto;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.ranking-row:last-child{
  border-bottom:0;
}

.rank{
  font-weight:800;
}

.player{
  font-weight:600;
}

.points{
  font-size:18px;
  font-weight:800;
}

.rank1 .rank{
  font-size:20px;
}

.rank2 .rank,
.rank3 .rank{
  font-size:18px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:16px;
}

.stat{
  background:#f5f5f7;
  border-radius:14px;
  padding:13px;
}

.stat-label{
  color:#777;
  font-size:12px;
}

.stat-value{
  font-size:21px;
  font-weight:800;
  margin-top:3px;
}

.history{
  border-top:1px solid #eee;
  padding-top:12px;
  margin-top:12px;
}

.match{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.match:last-child{
  border-bottom:0;
}

.date{
  color:#888;
  font-size:12px;
  margin-bottom:5px;
}

.match-player{
  display:flex;
  justify-content:space-between;
  padding:3px 0;
}

.hidden{
  display:none;
}

.empty{
  text-align:center;
  color:#888;
  padding:20px 0;
}

.back{
  margin-bottom:12px;
}

.notice{
  background:#fff7df;
  color:#735b00;
  border-radius:12px;
  padding:11px 13px;
  font-size:13px;
  margin-bottom:14px;
}
</style>
</head>

<body>

<header>
🎲 ボドゲスコア
</header>

<main>

<!-- 記録 -->
<div class="card">
  <h2>🎮 対戦を記録</h2>

  <input id="gameName" placeholder="ゲーム名（例：ドミニオン）">

  <div style="height:14px"></div>

  <div class="section-title">プレイヤーと得点</div>

  <div id="players">

    <div class="player-row">
      <input class="player-name" placeholder="プレイヤー名">
      <input class="player-score" type="number" placeholder="点数">
    </div>

    <div class="player-row">
      <input class="player-name" placeholder="プレイヤー名">
      <input class="player-score" type="number" placeholder="点数">
    </div>

  </div>

  <button class="secondary" onclick="addPlayer()">
    ＋ プレイヤーを追加
  </button>

  <button onclick="saveMatch()">
    対戦を記録する
  </button>
</div>


<!-- ゲーム一覧 -->
<div class="card">
  <h2>🎲 ゲーム</h2>

  <div id="gameList">
    <div class="empty">
      まだ対戦記録がありません
    </div>
  </div>
</div>


<!-- ゲーム詳細 -->
<div id="gameDetail" class="hidden">

  <button class="secondary back" onclick="closeGame()">
    ← ゲーム一覧に戻る
  </button>

  <div class="card">

    <h2 id="detailTitle"></h2>

    <div class="stats">

      <div class="stat">
        <div class="stat-label">対戦回数</div>
        <div class="stat-value" id="playCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">参加人数</div>
        <div class="stat-value" id="playerCount">0</div>
      </div>

    </div>

    <div class="section-title">
      🏆 歴代自己ベストランキング
    </div>

    <div id="ranking"></div>

  </div>


  <div class="card">

    <h2>🕐 対戦履歴</h2>

    <div id="history"></div>

  </div>

</div>

</main>


<script>

const STORAGE_KEY = "boardgameData";

let data = JSON.parse(
  localStorage.getItem(STORAGE_KEY)
) || {
  matches:[]
};


/* -------------------------
   プレイヤー追加
------------------------- */

function addPlayer(){

  const container =
    document.getElementById("players");

  const row =
    document.createElement("div");

  row.className="player-row";

  row.innerHTML=`
    <input class="player-name" placeholder="プレイヤー名">
    <input class="player-score" type="number" placeholder="点数">
  `;

  container.appendChild(row);
}


/* -------------------------
   対戦記録
------------------------- */

function saveMatch(){

  const game =
    document.getElementById("gameName")
    .value.trim();

  if(!game){
    alert("ゲーム名を入力してください");
    return;
  }

  const names =
    [...document.querySelectorAll(".player-name")];

  const scores =
    [...document.querySelectorAll(".player-score")];

  const players=[];

  for(let i=0;i<names.length;i++){

    const name=names[i].value.trim();
    const score=scores[i].value;

    if(name && score!==""){

      players.push({
        name:name,
        score:Number(score)
      });

    }
  }

  if(players.length<2){
    alert("2人以上入力してください");
    return;
  }

  data.matches.push({

    game:game,

    date:new Date().toISOString(),

    players:players

  });

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

  alert("対戦を記録しました！");

  resetForm();

  showGames();
}


/* -------------------------
   入力フォームリセット
------------------------- */

function resetForm(){

  document.getElementById("gameName")
    .value="";

  document.getElementById("players")
    .innerHTML=`

    <div class="player-row">
      <input class="player-name" placeholder="プレイヤー名">
      <input class="player-score" type="number" placeholder="点数">
    </div>

    <div class="player-row">
      <input class="player-name" placeholder="プレイヤー名">
      <input class="player-score" type="number" placeholder="点数">
    </div>

  `;
}


/* -------------------------
   ゲーム一覧
------------------------- */

function showGames(){

  const list =
    document.getElementById("gameList");

  const games=[
    ...new Set(
      data.matches.map(m=>m.game)
    )
  ];

  if(games.length===0){

    list.innerHTML=`
      <div class="empty">
        まだ対戦記録がありません
      </div>
    `;

    return;
  }

  list.innerHTML="";

  games.forEach(game=>{

    const matches=
      data.matches.filter(
        m=>m.game===game
      );

    const players=new Set();

    matches.forEach(match=>{
      match.players.forEach(p=>{
        players.add(p.name);
      });
    });

    const button=
      document.createElement("button");

    button.className="game";

    button.innerHTML=`
      <div>
        <div class="game-name">
          🎲 ${escapeHTML(game)}
        </div>

        <div class="game-meta">
          ${matches.length}回の対戦 ・
          ${players.size}人が参加
        </div>
      </div>

      <div class="arrow">›</div>
    `;

    button.onclick=()=>{
      showGame(game);
    };

    list.appendChild(button);

  });
}


/* -------------------------
   ゲーム詳細
------------------------- */

function showGame(game){

  document
    .getElementById("gameDetail")
    .classList.remove("hidden");

  document
    .getElementById("detailTitle")
    .textContent="🎲 "+game;

  const matches=
    data.matches.filter(
      m=>m.game===game
    );

  document
    .getElementById("playCount")
    .textContent=matches.length;


  /* 参加者数 */

  const allPlayers=new Set();

  matches.forEach(match=>{
    match.players.forEach(player=>{
      allPlayers.add(player.name);
    });
  });

  document
    .getElementById("playerCount")
    .textContent=allPlayers.size;


  /* 自己ベスト */

  const best={};

  matches.forEach(match=>{

    match.players.forEach(player=>{

      if(
        best[player.name]===undefined ||
        player.score>best[player.name]
      ){

        best[player.name]=player.score;

      }

    });

  });


  const ranking=
    Object.entries(best)
      .sort((a,b)=>b[1]-a[1]);


  const rankingElement=
    document.getElementById("ranking");

  rankingElement.innerHTML="";


  ranking.forEach((item,index)=>{

    const row=
      document.createElement("div");

    row.className="ranking-row";

    if(index===0) row.classList.add("rank1");
    if(index===1) row.classList.add("rank2");
    if(index===2) row.classList.add("rank3");

    row.innerHTML=`

      <div class="rank">
        ${index+1}位
      </div>

      <div class="player">
        ${escapeHTML(item[0])}
      </div>

      <div class="points">
        ${item[1]}点
      </div>

    `;

    rankingElement.appendChild(row);

  });


  /* 履歴 */

  const history=
    document.getElementById("history");

  history.innerHTML="";


  [...matches]
    .reverse()
    .forEach(match=>{

      const div=
        document.createElement("div");

      div.className="match";

      const date=
        new Date(match.date);

      let html=`
        <div class="date">
          ${date.toLocaleDateString(
            "ja-JP",
            {
              year:"numeric",
              month:"numeric",
              day:"numeric"
            }
          )}
        </div>
      `;

      const sorted=
        [...match.players]
          .sort((a,b)=>b.score-a.score);

      sorted.forEach(player=>{

        html+=`
          <div class="match-player">
            <span>${escapeHTML(player.name)}</span>
            <strong>${player.score}点</strong>
          </div>
        `;

      });

      div.innerHTML=html;

      history.appendChild(div);

    });

}


/* -------------------------
   詳細を閉じる
------------------------- */

function closeGame(){

  document
    .getElementById("gameDetail")
    .classList.add("hidden");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* -------------------------
   HTML安全化
------------------------- */

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* -------------------------
   起動
------------------------- */

showGames();

</script>

</body>
</html>
